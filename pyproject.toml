[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-network-monitor"
version = "1.0.0"
description = "A Python-based network monitoring and rule-based security detection tool"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "psutil>=7.0.0",
    "rich>=14.0.0",
    "scapy>=2.6.0"
]

[tool.setuptools.packages.find]
where = ["src"]


